plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

group = 'com.itkacher.okhttpprofiler'
version = '1.0.19'

def studioCompilePath = providers.gradleProperty('StudioCompilePath')
        .orElse(providers.environmentVariable('ANDROID_STUDIO_HOME'))
        .getOrNull()

if (!studioCompilePath) {
    throw new GradleException(
            'No StudioCompilePath value was set. Set -PStudioCompilePath to an Android Studio installation directory ' +
                    'or set ANDROID_STUDIO_HOME.'
    )
}

def studioDirectory = file(studioCompilePath)
if (!studioDirectory.isDirectory()) {
    throw new GradleException("Android Studio directory does not exist: $studioDirectory")
}

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        local(studioCompilePath)
        bundledPlugin('org.jetbrains.android')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

intellijPlatform {
    projectName = 'OkHttpProfiler'
    pluginConfiguration {
        version = project.version.toString()
        changeNotes = 'Published the Android runtime library through JitPack and updated integration guidance.'
        ideaVersion {
            sinceBuild = '261'
            untilBuild = provider { null }
        }
    }
}

tasks.register('verifySetup') {
    doLast {
        def platformJar = new File(studioDirectory, 'lib/app.jar')
        def androidPluginJar = new File(studioDirectory, 'plugins/android/lib/android.jar')
        if (!platformJar.exists() || !androidPluginJar.exists()) {
            throw new GradleException(
                    "Android Studio platform files not found under $studioDirectory. " +
                            'Set StudioCompilePath to an Android Studio installation directory.'
            )
        }
    }
}

tasks.named('compileJava') {
    dependsOn('verifySetup')
}
