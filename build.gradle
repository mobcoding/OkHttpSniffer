plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

group = 'com.mobcoding.okhttpsniffer'
version = '1.2.6'

def studioCompilePath = providers.gradleProperty('StudioCompilePath')
        .orElse(providers.environmentVariable('ANDROID_STUDIO_HOME'))
        .getOrNull()

if (!studioCompilePath) {
    throw new GradleException(
            'No StudioCompilePath value was set. Set -PStudioCompilePath to an Android Studio installation directory ' +
                    'or set ANDROID_STUDIO_HOME.'
    )
}

def studioDirectory = file(studioCompilePath)
if (!studioDirectory.isDirectory()) {
    throw new GradleException("Android Studio directory does not exist: $studioDirectory")
}

def studioBuild = new File(studioDirectory, 'build.txt')
def studioBaseline = studioBuild.isFile() ? (studioBuild.text.trim() =~ /^(?:[A-Z]+-)?(\d+)\./) : null
def compilerJavaVersion = studioBaseline?.find() && studioBaseline.group(1).toInteger() >= 262 ? 25 : 21

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        local(studioCompilePath)
        bundledPlugin('org.jetbrains.android')
        pluginVerifier()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    }
}

kotlin {
    jvmToolchain(compilerJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

intellijPlatform {
    projectName = 'OkHttpSniffer'
    pluginVerification {
        ides {
            local(studioCompilePath)
        }
    }
    pluginConfiguration {
        version = project.version.toString()
        description = providers.fileContents(layout.projectDirectory.file('marketplace/description.html')).asText
        changeNotes = providers.fileContents(layout.projectDirectory.file('marketplace/change-notes.html')).asText
        ideaVersion {
            sinceBuild = '261'
            untilBuild = provider { null }
        }
    }
}

tasks.register('verifySetup') {
    doLast {
        def platformJars = ['lib/app.jar', 'lib/app-backend.jar']
        def androidPluginJar = new File(studioDirectory, 'plugins/android/lib/android.jar')
        if (!platformJars.any { new File(studioDirectory, it).isFile() } || !androidPluginJar.isFile()) {
            throw new GradleException(
                    "Android Studio platform files not found under $studioDirectory. " +
                            'Set StudioCompilePath to an Android Studio installation directory.'
            )
        }
    }
}

tasks.named('compileJava') {
    dependsOn('verifySetup')
}
