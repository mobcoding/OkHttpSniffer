<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>OkHttpSniffer Logo 草案</title>
<style>
body { margin: 40px; font: 16px system-ui, sans-serif; background: #f3f4f6; color: #20232a; }
main { max-width: 760px; margin: auto; }
.panel { display: flex; align-items: center; gap: 32px; margin: 20px 0; padding: 28px; border-radius: 12px; background: white; }
.dark { background: #1e1f22; color: #e4e6eb; }
.label { margin-left: auto; }
p { line-height: 1.65; }
</style>
<main>
<h1>OkHttpSniffer</h1>
<p>Marketplace Logo 草案 · 40×40 SVG · 请求 / 响应双向箭头</p>
<div class="panel"><img src="pluginIcon.svg" width="40" height="40" alt="浅色版 40px"><img src="pluginIcon.svg" width="80" height="80" alt="浅色版 80px"><span class="label">Light · 40 / 80px</span></div>
<div class="panel dark"><img src="pluginIcon_dark.svg" width="40" height="40" alt="深色版 40px"><img src="pluginIcon_dark.svg" width="80" height="80" alt="深色版 80px"><span class="label">Dark · 40 / 80px</span></div>

</main>
</html>
